<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#173f36"><meta name="apple-mobile-web-app-capable" content="yes"><title>COFIVERP • Training Journal</title>
<style>
:root{--bg:#f5f4ee;--card:#fffefa;--ink:#203b34;--muted:#687970;--line:#dce2d8;--green:#173f36;--lime:#d7ed9b;--red:#a84431}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;touch-action:manipulation}button,input,select{min-height:46px;border-radius:12px;border:1px solid var(--line);padding:10px 12px;background:var(--card);color:var(--ink)}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #96b954}button:disabled{opacity:.5}input{min-width:0;width:100%;font-size:16px}input[type=checkbox]{width:23px;min-height:23px;accent-color:var(--green)}select{max-width:100%}h1{font-size:34px;letter-spacing:-1.4px;margin:8px 0}h2{font-size:23px;letter-spacing:-.5px;margin:0 0 12px}h3{font-size:18px;margin:0 0 5px;line-height:1.3}p{line-height:1.5}small,.small{font-size:13px;line-height:1.5}.muted{color:var(--muted)}.eyebrow{text-transform:uppercase;letter-spacing:2px;font-size:11px;font-weight:700}.shell{max-width:620px;margin:auto;padding:24px 18px calc(104px + env(safe-area-inset-bottom));padding-top:max(24px,env(safe-area-inset-top))}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.brand{font-size:13px;font-weight:800;letter-spacing:2px}.mark{background:var(--green);color:var(--lime);border-radius:10px;padding:10px;margin-right:8px}.badge{padding:7px 10px;border-radius:99px;background:#e6ebdf;font-size:12px}.hero{background:var(--green);color:#fff;border-radius:24px;padding:24px;margin:20px 0}.hero p{color:#c4d4cc;margin:8px 0 20px}.hero .eyebrow{color:var(--lime)}.stats{display:flex;gap:26px}.stats strong{display:block;font-size:27px}.stats small{color:#c4d4cc}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin:12px 0}.routine{display:flex;align-items:center;width:100%;text-align:left;gap:15px;padding:18px;border-radius:18px;margin:10px 0}.letter{font-size:24px;display:grid;place-items:center;width:50px;height:50px;background:#e9eedd;border-radius:14px;flex-shrink:0}.routine strong{display:block;font-size:18px;margin-bottom:4px}.routine small{color:var(--muted)}.arrow{margin-left:auto}.primary{background:var(--green);color:white;border-color:var(--green);font-weight:650}.lime{background:var(--lime);color:var(--green);border-color:var(--lime)}.wide{width:100%}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.wrap{flex-wrap:wrap}.stack{display:grid;gap:12px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;font-size:13px;color:var(--muted)}label input,label select{display:block;margin-top:6px;width:100%}nav{position:fixed;bottom:0;left:0;right:0;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:#fffefaed;border-top:1px solid var(--line);backdrop-filter:blur(12px);z-index:20;display:flex;justify-content:center;gap:5px}nav button{border:0;background:none;width:min(24%,140px);font-size:12px;display:grid;gap:5px;padding:7px;min-height:55px}nav .active{background:#e8eddf;font-weight:700}nav span{font-size:20px} .hint{border-left:3px solid #abc776;padding:8px 12px;background:#f0f4e8;font-size:13px;line-height:1.5;margin:12px 0}.setrow,.sethead{display:grid;grid-template-columns:26px minmax(65px,1fr) minmax(55px,.8fr) minmax(48px,.7fr) 44px;gap:6px;align-items:center;margin:7px 0}.sethead{font-size:11px;color:var(--muted);text-align:center;margin-top:17px}.setrow input{padding:10px 6px;text-align:center}.setrow button{padding:0;min-height:44px;border-radius:10px}.setrow.done button{background:var(--green);color:white}.setrow.done input{background:#edf2e6}.side{font-size:11px;font-weight:700;margin-top:14px}.note{margin-top:12px}.danger{color:var(--red)}.link{border:none;background:none;padding:6px;min-height:44px;text-decoration:underline}#toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--green);color:white;padding:13px 18px;border-radius:15px;z-index:100;max-width:90%;box-shadow:0 4px 22px #0002} .empty{text-align:center;padding:35px 15px;color:var(--muted)}.bar{height:6px;background:#e1e8d8;border-radius:10px;overflow:hidden;margin-top:16px}.bar i{display:block;height:100%;background:#c4df88}.historyline{padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}.historyline:last-child{border:0}.timer{position:sticky;top:8px;z-index:10;background:#e2edcd;border:1px solid #bfcda6;border-radius:15px;padding:9px 12px;margin:12px 0}.timer button{min-height:36px;padding:6px 9px;font-size:12px}details summary{cursor:pointer;line-height:1.5}svg{width:100%;height:auto}textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--card);font-size:16px;resize:vertical} .pill{font-size:11px;padding:4px 7px;background:#eef2e6;border-radius:6px;white-space:nowrap} .spacer{height:8px}@media(min-width:800px){.shell{padding-top:35px}}@media(prefers-reduced-motion:no-preference){button{transition:background .15s}}
</style></head><body><div class="shell"><header><div class="brand"><span class="mark">C</span>COFIVERP</div><span class="badge" id="week"></span></header><main id="app"></main></div><nav id="nav"></nav><div id="toast" role="status" hidden></div><input id="importFile" type="file" accept="application/json,.json" hidden>
<script>
'use strict';
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const day=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*60000).toISOString().slice(0,10)},uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const E={sq:['Squat Machine'],cp:['Chest Press Machine'],row:['Chest-Supported Row'],curl:['Seated Hamstring Curl'],rear:['Reverse Pec Deck / Rear Delt Fly'],pallof:['Cable Pallof Press','side'],leg:['Leg Press'],hip:['Glute Bridge / Hip Thrust Machine'],lat:['Lat Pulldown'],smith:['Smith Incline Press'],face:['Cable Face Pull'],ext:['Leg Extension'],shoulder:['Shoulder Press Machine'],dbp:['Dumbbell Bench Press','db'],dbr:['One-Arm Supported Dumbbell Row','dbside'],split:['Dumbbell Split Squat','dbside'],rdl:['Dumbbell Romanian Deadlift','db'],yt:['Prone Y/T Raises','light'],wall:['Wall Slides','body']};
const P={A:{name:'Gym A',desc:'Full body strength',place:'Pangasinan · 50–60 min',ex:[['sq',3,5,8],['cp',3,6,10],['row',3,6,10],['curl',2,8,12],['rear',2,12,15],['pallof',2,10,10]]},B:{name:'Gym B',desc:'Full body strength',place:'Pangasinan · 50–60 min',ex:[['leg',3,6,10],['hip',3,8,12],['lat',3,6,10],['cp',2,8,10],['row',2,8,12],['face',2,12,15]]},C:{name:'Gym C',desc:'Optional third gym day',place:'Pangasinan · 30–40 min',ex:[['ext',2,10,12],['curl',2,10,12],['lat',2,8,12],['shoulder',2,8,12],['rear',2,12,15]]},H:{name:'Baguio',desc:'Home dumbbell workout',place:'15 & 20 lb dumbbells · 35–45 min',ex:[['dbp',3,8,15],['dbr',3,10,15],['split',2,10,15],['rdl',2,10,15],['yt',2,10,10],['wall',2,10,10]]}};
const KEY='cofiverp-journal-v1';let storageOK=true,loadProblem=false;let data={version:1,start:day(),sessions:[],cardio:[],draft:null};try{let raw=localStorage.getItem(KEY);if(raw){let d=JSON.parse(raw);validate(d);data=d}}catch(e){loadProblem=true;storageOK=false}
let tab='train',filter='sq',timerEnd=0,toastId;
function save(){if(loadProblem){toast('Stored data could not be read. Export a backup before restoring data.');return false}try{localStorage.setItem(KEY,JSON.stringify(data));storageOK=true;return true}catch(e){storageOK=false;toast('Could not save on this browser. Export your data now.');return false}}
function toast(s){$('#toast').textContent=s;$('#toast').hidden=false;clearTimeout(toastId);toastId=setTimeout(()=>$('#toast').hidden=true,4200)}
function week(){return Math.max(1,Math.floor((Date.parse(day())-Date.parse(data.start))/604800000)+1)}
function move(t){tab=t;render();window.scrollTo(0,0)}
function render(){let w=week();$('#week').textContent=w>8?'Program complete':'Week '+w+' of 8';$('#nav').innerHTML=[['train','◫','Train'],['progress','＋','Progress'],['cardio','≈','Cardio'],['settings','⚙','Settings']].map(([t,i,n])=>`<button class="${t===tab?'active':''}" onclick="move('${t}')"><span aria-hidden="true">${i}</span>${n}</button>`).join('');$('#app').innerHTML=tab==='train'?(data.draft?workout():home()):tab==='progress'?progress():tab==='cardio'?cardio():settings();}
function home(){let cutoff=Date.parse(day())-6*86400000,n=data.sessions.filter(s=>Date.parse(s.date)>=cutoff&&s.date<=day()).length;return `<div class="eyebrow muted">Your training journal</div><h1>Build for the long run.</h1><div class="hero"><div class="eyebrow">Longevity → Strength → Shoulders</div><h2 style="margin-top:12px">One session at a time.</h2><p>Your 8-week program, ready when you are.</p><div class="stats"><div><strong>${n}</strong><small>sessions · last 7 days</small></div><div><strong>${data.sessions.length}</strong><small>sessions logged</small></div></div><div class="bar"><i style="width:${Math.min(100,(week()-1)/8*100)}%"></i></div></div><h2>Choose your workout</h2>${Object.entries(P).map(([k,p])=>`<button class="routine" onclick="start('${k}')"><span class="letter">${k==='H'?'⌂':k}</span><span><strong>${p.name}</strong><small>${p.desc}<br>${p.place}</small></span><span class="arrow">›</span></button>`).join('')}<div class="hint">Gym A + B only? Make Baguio your third strength session. After A + B + C, keep Baguio optional or lighter.</div><details class="card"><summary>Training reminders</summary><p class="small">Warm up for 5–10 minutes, then use lighter exercise-specific sets. Generally leave 2 repetitions in reserve. Rest 2–3 minutes for compound lifts and 60–90 seconds for accessories. Increase reps first, then resistance. Allow about 48 hours between demanding sessions for the same muscle groups when practical.</p></details>${!storageOK?'<p class="danger">Device saving is unavailable. Use Settings to export a backup.</p>':''}`}
function last(id,unit){return data.sessions.filter(s=>s.id!==data.draft?.id).sort((a,b)=>b.date.localeCompare(a.date)||b.saved-a.saved).flatMap(s=>s.ex.map(e=>({...e,date:s.date}))).find(e=>e.id===id&&(!unit||e.unit===unit)&&e.sets.some(x=>x.done))}
function makeEx(a){let[id,count,lo,hi]=a,type=E[id][1]||'',unit=type.includes('db')||type==='light'?'lb':'kg',prev=last(id,unit),sides=type.includes('side')?['L','R']:[''];return {id,count,lo,hi,unit,note:'',sets:sides.flatMap(side=>Array.from({length:count},(_,i)=>({side,weight:prev?.sets.find((s,j)=>s.side===side&&(j%count)===i)?.weight??(type==='body'?'0':''),reps:'',rir:'',done:false})))}}
function start(k){data.draft={id:uid(),kind:k,date:day(),ex:P[k].ex.map(makeEx),saved:0};save();render();window.scrollTo(0,0)}
function previous(e){let p=last(e.id,e.unit);if(!p)return 'First session — choose a comfortable starting load.';return `Last · ${esc(p.date)}: `+p.sets.filter(s=>s.done).map(s=>`${s.side?s.side+' ':''}${s.weight} ${p.unit} × ${s.reps}`).join(' · ')}
function cue(e){let p=last(e.id,e.unit);if(!p)return '';let s=p.sets.filter(x=>x.done);if(s.length>=e.sets.length&&s.every(x=>+x.reps>=e.hi&&x.rir!==''&&+x.rir>=2)&&new Set(s.map(x=>+x.weight)).size===1&&E[e.id][1]!=='body')return '<div class="hint">Last session reached the top of this rep range with at least 2 RIR. Consider the smallest available weight increase if technique and comfort were good.</div>';return ''}
function workout(){let d=data.draft,p=P[d.kind];return `<div class="row"><div><div class="eyebrow muted">${p.place}</div><h1>${p.name}</h1></div><span class="badge" id="count"></span></div><div class="grid2"><label>Session date<input type="date" value="${d.date}" onchange="data.draft.date=this.value;save()"></label><div class="small muted" style="padding-top:24px">Target: 2 RIR<br>Tap ✓ after each set</div></div><div class="timer row"><span id="clock">Rest timer</span><div><button onclick="rest(90)">90s</button> <button onclick="rest(150)">150s</button> <button onclick="rest(0)" aria-label="Stop timer">×</button></div></div>${d.ex.map((e,i)=>`<section class="card"><div class="row"><span class="eyebrow muted">Exercise ${i+1}</span><span class="pill">${e.count} × ${e.lo===e.hi?e.lo:e.lo+'–'+e.hi}${E[e.id][1]?.includes('side')?' / side':''}</span></div><h3 style="margin-top:10px">${E[e.id][0]}</h3>${d.kind==='B'&&i===3?`<label>Press variation<select onchange="variant(this.value)"><option value="cp" ${e.id==='cp'?'selected':''}>Chest Press Machine</option><option value="smith" ${e.id==='smith'?'selected':''}>Smith Incline Press</option></select></label>`:''}<div class="row small muted"><span>${E[e.id][1]?.includes('db')?'Weight per dumbbell':E[e.id][1]==='body'?'Reps only · unweighted':'Use a consistent machine / load convention'}</span><select aria-label="Weight unit for ${E[e.id][0]}" onchange="setUnit(${i},this.value)"><option ${e.unit==='kg'?'selected':''}>kg</option><option ${e.unit==='lb'?'selected':''}>lb</option></select></div><p class="small muted">${previous(e)}</p>${cue(e)}${e.id==='yt'?'<p class="small muted">One set = 10 Y raises + 10 T raises. Log 10 after both; use 0 for unweighted.</p>':''}<div class="sethead"><span>Set</span><span>${E[e.id][1]==='body'?'Load':e.unit}</span><span>Reps</span><span>RIR*</span><span>Done</span></div>${e.sets.map((s,j)=>`${s.side&&j%e.count===0?`<div class="side">${s.side==='L'?'LEFT':'RIGHT'}</div>`:''}<div class="setrow ${s.done?'done':''}" id="set-${i}-${j}"><span class="small muted">${j%e.count+1}</span><input aria-label="${E[e.id][0]} set ${j+1} weight" type="number" inputmode="decimal" min="0" step="any" ${E[e.id][1]==='body'?'disabled':''} placeholder="—" value="${esc(s.weight)}" oninput="field(${i},${j},'weight',this.value)"><input aria-label="${E[e.id][0]} set ${j+1} reps" type="number" inputmode="numeric" min="1" step="1" placeholder="—" value="${esc(s.reps)}" oninput="field(${i},${j},'reps',this.value)"><input aria-label="Repetitions in reserve" type="number" inputmode="numeric" min="0" max="10" placeholder="2" value="${esc(s.rir)}" oninput="field(${i},${j},'rir',this.value)"><button aria-label="Mark set ${j+1} complete for ${E[e.id][0]}" aria-pressed="${s.done}" onclick="toggle(${i},${j})">✓</button></div>`).join('')}<input class="note" aria-label="Notes for ${E[e.id][0]}" placeholder="Notes · machine setting, comfort…" value="${esc(e.note)}" oninput="data.draft.ex[${i}].note=this.value;save()"></section>`).join('')}<p class="small muted">*RIR = repetitions you could still do. Optional; enter it to enable progression cues. Blank sets remain unlogged.</p><button class="primary wide" onclick="finish()">Save workout</button><button class="link danger wide" onclick="discard()">Discard current draft</button>`}
function field(i,j,k,v){let s=data.draft.ex[i].sets[j];s[k]=v;s.done=false;$('#set-'+i+'-'+j).classList.remove('done');$('#set-'+i+'-'+j+' button').setAttribute('aria-pressed','false');save();counts()}
function validSet(s){return s.weight!==''&&Number.isFinite(+s.weight)&&+s.weight>=0&&s.reps!==''&&Number.isInteger(+s.reps)&&+s.reps>0&&(s.rir===''||(Number.isFinite(+s.rir)&&+s.rir>=0&&+s.rir<=10))}
function toggle(i,j){let s=data.draft.ex[i].sets[j];if(!s.done&&!validSet(s)){toast('Enter a weight (0 for unweighted), whole-number reps, and RIR from 0–10.');return}s.done=!s.done;save();let r=$('#set-'+i+'-'+j);r.classList.toggle('done',s.done);r.querySelector('button').setAttribute('aria-pressed',s.done);counts()}
function counts(){if(!$('#count')||!data.draft)return;let s=data.draft.ex.flatMap(e=>e.sets);$('#count').textContent=s.filter(x=>x.done).length+' / '+s.length+' sets'}
function setUnit(i,u){let e=data.draft.ex[i];if(e.sets.some(s=>s.weight!==''&&+s.weight!==0)&&!confirm('Change the unit label? Values will not be converted. Check the numbers before continuing.')){render();return}e.unit=u;e.sets.forEach(s=>s.done=false);save();render()}
function variant(id){let old=data.draft.ex[3];if(old.sets.some(s=>s.done||s.reps!=='')&&!confirm('Replace the current press entries with the other variation?')){render();return}data.draft.ex[3]=makeEx([id,2,8,10]);save();render()}
function finish(){let d=data.draft,s=d.ex.flatMap(e=>e.sets);if(!/^\d{4}-\d{2}-\d{2}$/.test(d.date)||!Number.isFinite(Date.parse(d.date))){toast('Choose a valid date.');return}if(!s.some(x=>x.done)){toast('Mark at least one completed set with ✓.');return}if(s.some(x=>!x.done&&(x.reps!==''||x.rir!==''))&&!confirm('Some entered sets are not marked complete. Save only the checked sets?'))return;d.saved=Date.now();data.sessions=data.sessions.filter(x=>x.id!==d.id);data.sessions.push(structuredClone(d));data.draft=null;let ok=save();timerEnd=0;render();toast(ok?'Workout saved.':'Workout is in memory only. Export a backup in Settings.');window.scrollTo(0,0)}
function discard(){if(confirm('Discard this draft? Previously saved sessions stay in history.')){data.draft=null;save();render()}}
function edit(id){if(data.draft&&!confirm('Replace the current draft with this saved workout?'))return;data.draft=structuredClone(data.sessions.find(s=>s.id===id));move('train')}
function del(id){if(confirm('Delete this saved workout?')){data.sessions=data.sessions.filter(s=>s.id!==id);save();render()}}
function rest(n){timerEnd=n?Date.now()+n*1000:0;tick()}
function tick(){counts();if(!$('#clock'))return;if(timerEnd&&Date.now()>=timerEnd){timerEnd=0;toast('Rest complete.')}let s=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));$('#clock').textContent=timerEnd?Math.floor(s/60)+':'+String(s%60).padStart(2,'0')+' remaining':'Rest timer'}setInterval(tick,500);
function progress(){let entries=data.sessions.slice().sort((a,b)=>a.date.localeCompare(b.date)||a.saved-b.saved).flatMap(s=>s.ex.filter(e=>e.id===filter&&e.sets.some(x=>x.done)).map(e=>({e,s})));let chart='';for(let unit of ['kg','lb']){let points=entries.filter(x=>x.e.unit===unit).map(x=>({date:x.s.date,v:Math.max(...x.e.sets.filter(s=>s.done).map(s=>+s.weight))}));if(!points.length)continue;let max=Math.max(...points.map(p=>p.v),1),coords=points.map((p,i)=>`${30+(points.length===1?150:i*300/(points.length-1))},${130-p.v/max*100}`);chart+=`<p class="small">Heaviest completed set · ${unit}</p><svg viewBox="0 0 360 165" role="img" aria-label="Heaviest weight by session in ${unit}"><path d="M30 20V135H335" stroke="#dce2d8" fill="none"/><polyline points="${coords.join(' ')}" fill="none" stroke="#173f36" stroke-width="3"/>${coords.map((c,i)=>`<circle cx="${c.split(',')[0]}" cy="${c.split(',')[1]}" r="4" fill="#173f36"><title>${points[i].date}: ${points[i].v} ${unit}</title></circle>`).join('')}<text x="30" y="158" font-size="11" fill="#687970">${points[0].date}</text><text x="330" y="158" text-anchor="end" font-size="11" fill="#687970">${points.at(-1).date}</text><text x="30" y="13" font-size="11" fill="#687970">Peak: ${Math.max(...points.map(p=>p.v))} ${unit}</text></svg>`}
return `<div class="eyebrow muted">See your consistency</div><h1>Progress</h1><label>Exercise<select onchange="filter=this.value;render()">${Object.entries(E).map(([id,e])=>`<option value="${id}" ${filter===id?'selected':''}>${e[0]}</option>`).join('')}</select></label><section class="card">${chart||'<div class="empty">Your first completed session starts the story.</div>'}</section>${entries.slice().reverse().map(({e,s})=>`<div class="card"><div class="row"><strong>${s.date}</strong><span class="badge">${P[s.kind].name}</span></div>${e.sets.filter(x=>x.done).map(x=>`<div class="historyline">${x.side?x.side+' · ':''}${E[e.id][1]==='body'?'Unweighted':x.weight+' '+e.unit+(E[e.id][1]?.includes('db')?' / hand':'')} × <strong>${x.reps} reps</strong>${x.rir!==''?' · '+x.rir+' RIR':''}</div>`).join('')}${e.note?`<p class="small muted">${esc(e.note)}</p>`:''}</div>`).join('')}<h2 style="margin-top:28px">Workout history</h2>${data.sessions.slice().sort((a,b)=>b.date.localeCompare(a.date)||b.saved-a.saved).map(s=>`<div class="card"><div class="row"><div><strong>${P[s.kind].name}</strong><p class="small muted">${s.date} · ${s.ex.flatMap(e=>e.sets).filter(x=>x.done).length} sets</p></div><button onclick="edit('${s.id}')">Edit</button></div><button class="link danger" onclick="del('${s.id}')">Delete workout</button></div>`).join('')||'<p class="muted">No workouts saved yet.</p>'}`}
function cardio(){return `<div class="eyebrow muted">Calasiao & Baguio</div><h1>Keep moving.</h1><div class="card"><h3>${week()<=4?'Weeks 1–4 · Aerobic foundation':'Weeks 5–8 · Aerobic development'}</h3><p class="small">${week()<=4?'Two evenings of incline walking, 35–45 minutes at RPE 3–4. Keep a pace where you can speak in full sentences.':'One moderate walk, 40–45 minutes at RPE 3–4. When conditioning and tolerance are adequate, use a second session for intervals: 7-minute warm-up, 4 × 2-minute hard efforts (RPE 7–8), 3-minute easy recovery between efforts, and a 5–8-minute cool-down.'}</p><p class="small muted">Optional Baguio walk or hike: 45–60 minutes at comfortable to moderate intensity. Gradually work toward 150 moderate-equivalent minutes a week.</p></div><form class="card stack" onsubmit="addCardio(event)"><h3>Log aerobic activity</h3><div class="grid2"><label>Date<input required name="date" type="date" value="${day()}"></label><label>Minutes<input required name="minutes" type="number" inputmode="numeric" min="1" max="1440"></label></div><label>Activity<select name="activity"><option>Incline walking</option><option>Incline intervals</option><option>Outdoor walk / hike</option></select></label><div class="grid2"><label>Session RPE (1–10)<input required name="rpe" type="number" inputmode="numeric" min="1" max="10"></label><label>Incline % (optional)<input name="incline" type="number" inputmode="decimal" min="0" max="50" step="any"></label></div><label>Notes<input name="notes" placeholder="Speed, intervals, how it felt…"></label><button class="primary">Save activity</button></form><h2>Activity history</h2>${data.cardio.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(c=>`<div class="card"><strong>${esc(c.activity)}</strong><p class="small muted">${c.date} · ${c.minutes} min · RPE ${c.rpe}${c.incline!==''?' · '+c.incline+'% incline':''}</p>${c.notes?`<p class="small">${esc(c.notes)}</p>`:''}<button class="link danger" onclick="deleteCardio('${c.id}')">Delete activity</button></div>`).join('')||'<p class="muted">No aerobic activity logged yet.</p>'}`}
function addCardio(ev){ev.preventDefault();let c=Object.fromEntries(new FormData(ev.target));c.id=uid();data.cardio.push(c);let ok=save();render();toast(ok?'Activity saved.':'Activity is in memory only. Export a backup in Settings.')}
function deleteCardio(id){if(confirm('Delete this activity?')){data.cardio=data.cardio.filter(c=>c.id!==id);save();render()}}
function settings(){return `<div class="eyebrow muted">Make it yours</div><h1>Settings</h1><div class="card"><h3>Eight-week program</h3><label>Program start date<input type="date" value="${data.start}" onchange="if(this.value){data.start=this.value;save();render()}"></label><p class="small muted">This controls the week indicator and cardio guidance. Your history remains available after week 8.</p></div><div class="card stack"><h3>Your data</h3><p class="small muted">Entries stay in this browser on this device. There is no cloud sync. Export regularly, and before changing browsers or clearing website data.</p><button class="primary" onclick="downloadBackup()">Export backup · JSON</button><button onclick="$('#importFile').click()">Restore from backup</button><p class="small muted">Restoring replaces this browser’s journal after confirmation. Export first to keep a copy.</p><p class="small ${storageOK?'muted':'danger'}">${storageOK?'Device saving is available.':'Device saving is unavailable or stored data could not be read.'}</p></div><div class="card"><h3>Using this on your iPhone</h3><p class="small muted">The HTML contains the entire app. Use a browser that runs HTML and allows local storage. A Files preview may not run the app. For everyday Safari use and a Home Screen icon, serve this HTML from a stable web address; keep using the same address so your saved data stays together.</p><p class="small muted">Gym loads default to kg; home dumbbells default to lb per hand. Compare the same equipment, technique, and load convention over time. Changing unit labels does not convert values.</p></div>`}
function downloadBackup(){let raw=loadProblem?localStorage.getItem(KEY):JSON.stringify(data,null,2);let blob=new Blob([raw||JSON.stringify(data)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='COFIVERP-backup-'+day()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),30000)}
function validate(d){const fail=()=>{throw Error('Invalid backup')},date=v=>typeof v==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(v)&&Number.isFinite(Date.parse(v)),str=v=>typeof v==='string'&&v.length<=10000,num=v=>v===''||(typeof v==='string'||typeof v==='number')&&Number.isFinite(+v)&&+v>=0&&+v<=100000;
if(!d||d.version!==1||!date(d.start)||!Array.isArray(d.sessions)||!Array.isArray(d.cardio))fail();for(let s of [...d.sessions,...(d.draft?[d.draft]:[])]){if(!s||!str(s.id)||!/^\w+$/.test(s.id)||!P[s.kind]||!date(s.date)||!Number.isFinite(s.saved)||!Array.isArray(s.ex)||s.ex.length>30)fail();for(let e of s.ex){if(!E[e.id]||!['kg','lb'].includes(e.unit)||!str(e.note)||!Number.isInteger(e.count)||e.count<1||e.count>20||!Number.isFinite(e.lo)||!Number.isFinite(e.hi)||!Array.isArray(e.sets)||e.sets.length>40)fail();for(let s of e.sets){if(!['','L','R'].includes(s.side)||typeof s.done!=='boolean'||!num(s.weight)||!num(s.reps)||!num(s.rir)||(s.done&&!validSet(s)))fail()}}}for(let c of d.cardio){if(!c||!str(c.id)||!/^\w+$/.test(c.id)||!date(c.date)||!str(c.activity)||!str(c.notes)||!num(c.minutes)||+c.minutes<1||+c.minutes>1440||!num(c.rpe)||+c.rpe<1||+c.rpe>10||!num(c.incline))fail()}}
$('#importFile').addEventListener('change',async ev=>{let f=ev.target.files[0];if(!f)return;try{if(f.size>20000000)throw Error();let d=JSON.parse(await f.text());validate(d);if(confirm(`Replace this journal with ${d.sessions.length} workouts and ${d.cardio.length} aerobic activities from the backup?`)){data=d;loadProblem=false;save();render();toast('Backup restored.')}}catch(e){toast('This file is not a valid COFIVERP backup. No data was changed.')}finally{ev.target.value=''}});
render();tick();
</script></body></html>
